error_log /var/log/nginx/error.log ${NGINX_LOG_LEVEL};

server {
    listen ${PORT};
    server_name ${SERVER_NAME};
    root /app/www;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Oculta la versión de nginx en headers y error pages
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # env-config.js: nunca cachear, siempre tiene que traer los valores actuales
    location = /env-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Assets con hash de Vite: cache agresivo
    location /assets {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Bloquea acceso a dotfiles (.env, .git, etc. si quedaran copiados)
    location ~ /\. {
        deny all;
    }
}