# fly.toml app configuration file for backend-nameless-dream-346

app = 'backend-nameless-dream-346'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'
  context = '.'

[env]
  NODE_ENV = 'production'

[[mounts]]
  source = 'uploads'
  destination = '/app/public/uploads'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  ports = [{ port = 80, handlers = ["http"] }, { port = 443, handlers = ["tls", "http"] }]

  [[services.http_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'get'
    path = '/health'
    protocol = 'http'

[[vm]]
  memory = '256mb'  
  cpu_kind = 'shared'
  cpus = 1
  soft_limit = 40